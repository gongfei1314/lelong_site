<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 页面未找到 - 乐融建材</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--c-bg-soft);padding:20px">
    <div style="text-align:center;background:#fff;border:1px solid var(--c-line);border-radius:var(--radius-lg);padding:70px 56px;max-width:520px;box-shadow:var(--shadow-sm)">
      <svg width="120" height="90" viewBox="0 0 240 180" fill="none" style="margin:0 auto 24px">
        <rect x="30" y="30" width="60" height="50" rx="4" fill="#f0b35c"/>
        <rect x="96" y="30" width="60" height="50" rx="4" fill="#e8a23e"/>
        <rect x="63" y="86" width="60" height="50" rx="4" fill="#f5c477"/>
        <rect x="30" y="142" width="126" height="12" rx="6" fill="#dfe8ee"/>
        <text x="195" y="72" font-size="34" font-weight="800" fill="#0e3a5d" font-family="sans-serif">404</text>
      </svg>
      <h1 style="font-size:26px;color:var(--c-primary);margin-bottom:10px">这面墙我们还没砌到</h1>
      <p style="color:var(--c-text-light);margin-bottom:30px">您访问的页面不存在或已被移动，请返回首页继续浏览。</p>
      <a href="index.html" class="btn btn-accent">返回首页</a>
    </div>
  </div>

</body>
</html>
