# ============================================================
# 乐融建材门户网站 · Nginx 配置示例
# 使用方法：
#   1. 将 lelong_site/ 目录内容上传至服务器，例如 /var/www/portal
#   2. 将本文件内容合并进 nginx 配置（或放入 conf.d/ 目录）
#   3. nginx -t 检查语法后，nginx -s reload 生效
# ============================================================

server {
    listen       80;
    server_name  www.example.com example.com;   # TODO: 替换为您自己的域名

    # 站点根目录（按实际部署路径修改）
    root   /var/www/portal;
    index  index.html;

    # 字符集
    charset utf-8;

    # ---------- 访问日志 ----------
    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 静态资源缓存 ----------
    location ~* \.(css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 页面直达（可选：省略 .html 后缀） ----------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---------- 自定义 404 ----------
    error_page 404 /404.html;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ---------- HTTP 跳转 HTTPS（申请证书后启用） ----------
    # return 301 https://$host$request_uri;
}

